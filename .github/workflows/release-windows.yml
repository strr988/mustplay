name: Publish Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish (for example v0.12.1)"
        required: true
        default: "v0.12.1"
      distribution_rights_confirmed:
        description: "I verified third-party licenses, codec distribution rights and notices for this ZIP"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.distribution_rights_confirmed == true
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Verify release version and tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -cne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match package.json version $version"
          }
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Only stable semver tags are allowed"
          }
          if (-not (Test-Path "docs/RELEASE_NOTES_$version.md")) {
            throw "Release notes for $version are missing"
          }
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir .pnpm-store
      - name: Type-check and build
        run: pnpm build
      - name: Unit tests
        run: pnpm test --maxWorkers=2 --testTimeout=15000
      - name: Source settings in Electron
        run: node --test --test-name-pattern "import, search, theme" tests/desktop.mjs
      - name: Build Windows x64 ZIP
        run: pnpm package:windows
      - name: Verify Windows ZIP and migrated profiles
        run: pnpm test:release
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $zip = "release/mustplay-$version-win-x64.zip"
          $sum = "$zip.sha256"
          if (-not (Test-Path $zip) -or -not (Test-Path $sum)) {
            throw "Missing release artifacts"
          }
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = ((Get-Content $sum -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          if ($actual -ne $expected) { throw "Archive SHA-256 mismatch" }
          gh release create $env:RELEASE_TAG $zip $sum --title "mustplay $env:RELEASE_TAG" --notes-file "docs/RELEASE_NOTES_$version.md" --target $env:GITHUB_SHA --latest
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publication failed" }
